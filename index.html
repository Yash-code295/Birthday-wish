<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: Arial;
            color: white;
            background: url('birthday.png') no-repeat center center/cover;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-top: 20%;
            font-size: 50px;
            text-shadow: 2px 2px 10px black;
        }

        /* Balloons */
        .balloon {
            position: absolute;
            width: 60px;
            animation: float 6s infinite;
        }

        @keyframes float {
            0% { bottom: -100px; }
            100% { bottom: 100%; }
        }
    </style>
</head>

<body>

<h1 id="msg"></h1>

<audio id="music" loop>
    <source src="https://www.myinstants.com/media/sounds/happy-birthday-to-you.mp3" type="audio/mpeg">
</audio>

<script>
    // Get name from URL
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "Friend";

    document.getElementById("msg").innerText =
        "🎉 Happy Birthday " + name + " 🎂";

    // Play music on first click (mobile friendly)
    document.body.addEventListener("click", function () {
        document.getElementById("music").play();
    }, { once: true });

    // Balloons animation
    for (let i = 0; i < 10; i++) {
        let b = document.createElement("img");
        b.src = "https://cdn-icons-png.flaticon.com/512/3468/3468371.png";
        b.className = "balloon";
        b.style.left = Math.random() * 100 + "%";
        b.style.animationDuration = (3 + Math.random()*5) + "s";
        document.body.appendChild(b);
    }
</script>

</body>
</html>
